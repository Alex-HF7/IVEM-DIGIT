{% extends 'plantilla/base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'operacion/management.css' %}">
<script src="{% static 'operacion/management.js' %}" defer></script>
<section class="container py-4 management-page">
  <header class="text-center mb-4"><span class="management-icon"><i class="bi {% block icon %}{% endblock %}" aria-hidden="true"></i></span><h1 class="mt-3">{% block heading %}{% endblock %}</h1><p class="text-muted">{% block subtitle %}{% endblock %}</p></header>
  {% block management_content %}{% endblock %}
</section>
{% endblock %}
