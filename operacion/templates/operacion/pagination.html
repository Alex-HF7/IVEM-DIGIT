{% if page.has_other_pages %}
<nav aria-label="Páginas del listado" class="d-flex justify-content-between align-items-center gap-3 mt-3">
  <span class="small text-muted">Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
  <div class="btn-group">
    {% if page.has_previous %}<a class="btn btn-outline-primary" href="?page={{ page.previous_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}">Anterior</a>{% endif %}
    {% if page.has_next %}<a class="btn btn-outline-primary" href="?page={{ page.next_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}">Siguiente</a>{% endif %}
  </div>
</nav>
{% endif %}
