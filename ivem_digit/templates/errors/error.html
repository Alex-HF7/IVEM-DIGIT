<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ status }} · {{ title }} · IVEM</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 18px; background: #f4f6f9; color: #334155; font-family: Arial, sans-serif; }
        main { position: relative; width: 100%; max-width: 600px; padding: 42px 36px; text-align: center; background: #fff; border: 1px solid #e6e9ee; border-radius: 24px; box-shadow: 0 16px 60px #42132d09; overflow: hidden; }
        main::before { content: ''; position: absolute; inset: 0 0 auto; height: 5px; background: #682145; }
        .brand { font-size: .78rem; letter-spacing: .2em; color: #82546a; font-weight: 700; margin: 0 0 26px; }
        .illustration { position: relative; display: grid; place-items: center; width: 132px; height: 132px; margin: 0 auto 12px; }
        .halo { position: absolute; inset: 4px; border-radius: 50%; background: #fbf0f5; animation: breathe 3s ease-in-out infinite; }
        .orbit { position: absolute; inset: 0; border: 1px dashed #d9b4c6; border-radius: 50%; animation: orbit 30s linear infinite; }
        .orbit::before { content: ''; position: absolute; top: 6px; left: 23px; width: 9px; height: 9px; border-radius: 50%; background: #682145; }
        svg { position: relative; width: 58px; height: 68px; color: #682145; animation: float 3s ease-in-out infinite; }
        .code { display: block; font-size: clamp(3.2rem, 12vw, 4.7rem); color: #682145; line-height: 1.1; font-weight: 700; letter-spacing: -.05em; margin: 12px 0; }
        h1 { font-size: clamp(1.3rem, 5vw, 1.8rem); color: #253247; margin: 0 0 14px; }
        .message { color: #64748b; line-height: 1.7; max-width: 430px; margin: 0 auto 28px; }
        .actions { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
        a { display: inline-block; border-radius: 10px; padding: 12px 20px; font-size: .9rem; text-decoration: none; background: #0d6efd; color: #fff; }
        a:hover { background: #0b5ed7; }
        a:focus-visible { outline: 3px solid #9d5378; outline-offset: 4px; }
        .footer { font-size: .75rem; color: #94a3b8; margin: 28px 0 0; }
        @keyframes breathe { 50% { transform: scale(.91); opacity: .65; } }
        @keyframes float { 50% { transform: translateY(-7px); } }
        @keyframes orbit { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
        @media (max-width: 480px) { main { padding: 32px 22px; } }
    </style>
</head>
<body>
    <main aria-labelledby="error-title">
        <p class="brand">IVEM</p>
        <div class="illustration" aria-hidden="true">
            <span class="halo"></span><span class="orbit"></span>
            <svg viewBox="0 0 58 68" fill="none"><path d="M12 3h23l13 13v46a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z" fill="white" stroke="currentColor" stroke-width="2.5"/><path d="M34 3v14h14M20 28h18M20 35h13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="29" cy="49" r="7" fill="#f4e3eb"/><path d="M29 45v5m0 3v.2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </div>
        <span class="code">{{ status }}</span>
        <h1 id="error-title">{{ title }}</h1>
        <p class="message">{{ message }}</p>
        <div class="actions"><a href="{{ home_url }}">Volver al inicio</a></div>
        <p class="footer">Sistema de gestión de oficios</p>
    </main>
</body>
</html>
