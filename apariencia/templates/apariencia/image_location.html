<figure class="image-location image-location--{{ name }}">
  <div class="image-location-label"><i class="bi bi-pin-map" aria-hidden="true"></i> Dónde se mostrará</div>
  {% if name == 'print_left_upload' or name == 'print_right_upload' %}
  <div class="location-paper" aria-hidden="true">
    {% for copy in '12' %}
    <div class="location-copy">
      <div class="location-letterhead">
        <span class="location-logo {% if name == 'print_left_upload' %}location-highlight{% endif %}">{% if name == 'print_left_upload' %}<i class="bi bi-image"></i>{% endif %}</span>
        <span class="location-logo {% if name == 'print_right_upload' %}location-highlight{% endif %}">{% if name == 'print_right_upload' %}<i class="bi bi-image"></i>{% endif %}</span>
      </div>
      <div class="location-lines"><span></span><span></span><span></span></div>
    </div>
    {% endfor %}
  </div>
  <figcaption>Encabezado {% if name == 'print_left_upload' %}izquierdo{% else %}derecho{% endif %} del oficio y su acuse.<small>Esquema de ubicación; el formato conserva sus medidas.</small></figcaption>
  {% else %}
  <div class="location-browser" aria-hidden="true">
    <div class="location-browser-tabs"><span class="{% if name == 'favicon_upload' %}location-highlight{% endif %}">{% if name == 'favicon_upload' %}<i class="bi bi-image"></i>{% else %}<i class="bi bi-circle-fill"></i>{% endif %}</span><span>IVEM</span><span class="location-browser-dot"></span></div>
    {% if name == 'login_logo_upload' %}
    <div class="location-login"><div class="location-login-brand"><span class="location-highlight"><i class="bi bi-image"></i></span></div><div class="location-login-fields"><div class="location-lines"><span></span><span></span><span></span></div><span class="location-login-button"></span></div></div>
    {% else %}
    <div class="location-navbar"><span class="location-nav-logo {% if name == 'site_logo_upload' %}location-highlight{% endif %}">{% if name == 'site_logo_upload' %}<i class="bi bi-image"></i>{% endif %}</span><span class="location-nav-link"></span><span class="location-nav-link"></span></div>
    <div class="location-page-content"><div class="location-lines"><span></span><span></span><span></span></div></div>
    <div class="location-footer {% if name == 'footer_upload' %}location-highlight{% endif %}">{% if name == 'footer_upload' %}<i class="bi bi-image"></i>{% endif %}</div>
    {% endif %}
  </div>
  <figcaption>{% if name == 'site_logo_upload' %}Logotipo en la barra superior de navegación.{% elif name == 'login_logo_upload' %}Logotipo en el panel de inicio de sesión.{% elif name == 'favicon_upload' %}Icono en la pestaña del navegador.{% elif name == 'footer_upload' %}Franja institucional al pie de las páginas.{% endif %}<small>El área resaltada indica la ubicación de esta imagen.</small></figcaption>
  {% endif %}
</figure>
